@if (urls().length) {
  <div class="gallery">
    @for (src of urls(); track src; let i = $index) {
      <button type="button" class="thumb" (click)="open(i)" [attr.aria-label]="'View photo ' + (i + 1) + ' of ' + urls().length">
        <img [src]="src" alt="" loading="lazy" />
      </button>
    }
  </div>
} @else {
  <p class="muted"><mat-icon inline>image_not_supported</mat-icon> No photos</p>
}
